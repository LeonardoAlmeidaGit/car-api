name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/leonardoalmeidagit

jobs:
  check-version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag and pyproject.toml
        run: |
          PROJECT_VERSION=$(grep '^version' pyproject.toml | cut -d '=' -f 2 | tr -d ' "')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: ${PROJECT_VERSION} | tag: ${TAG_VERSION}"
          if [ "${PROJECT_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PROJECT_VERSION}"
            exit 1
          fi

  test:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: car-api
            dockerfile: Dockerfile
          - image: car-api-mkdocs
            dockerfile: Dockerfile.mkdocs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-test:
    name: Smoke test
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.release.yml
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env from example
        run: cp .env.example .env

      - name: Pull published images
        run: docker compose pull app migrations mkdocs

      - name: Start stack
        run: docker compose up -d --no-build

      - name: Check API
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors \
              --retry-delay 2 \
                http://localhost:8000/health_check

      - name: Check docs
        run: |
          curl --fail --silent --show-error \
            --output /dev/null --retry 10 --retry-all-errors \
              --retry-delay 2 http://localhost:8001/

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  release:
    name: GitHub Release
    needs: smoke-test
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --generate-notes --latest
