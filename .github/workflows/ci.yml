name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgresql+psycopg://car_api:ci@localhost:5432/car_api
      JWT_SECRET_KEY: ci-test-secret-key-with-at-least-32-bytes
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint and test
        run: poetry run task test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.mkdocs]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
